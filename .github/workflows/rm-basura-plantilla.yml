name: rm basura plantilla
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf 'skills agente osquestador' 'Download code osquestador' 'Documentos proyectos osquestador' Osquestador 'Desplegar osquestador' 'Refactoria osquestador' 'PIPELINE osquestador' 'Método de trabajo osquestador' 'Agente motores osquestador'
          git add -A -- ':!.github'
          git diff --cached --quiet && exit 0
          git commit -m 'rm: plantillas vacias no pedidas'
          git pull --rebase origin main
          git push --no-verify origin main
