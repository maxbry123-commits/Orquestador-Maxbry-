name: inventory-forensic-v3-recovery-provenance-Orquestador-Maxbry-

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inventory-forensic-v3-recovery-provenance-Orquestador-Maxbry-.yml"

permissions:
  contents: read

jobs:
  recover_provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main history without eager blobs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none

      - name: Scan ZIP provenance without inventing sources
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          mkdir -p audit-v3-provenance
          python3 - <<'PY'
          import json, os, re, subprocess

          repo=os.environ["REPOSITORY"]
          run_id=os.environ["RUN_ID"]
          server=os.environ["SERVER_URL"]

          def run(args, check=True):
              p=subprocess.run(args,stdout=subprocess.PIPE,stderr=subprocess.PIPE,check=check)
              return p.stdout.decode("utf-8","replace")

          head=run(["git","rev-parse","HEAD"]).strip()
          raw=run(["git","ls-tree","-r","-l","HEAD"])
          zips=[]
          for line in raw.splitlines():
              try:
                  meta,path=line.split("\t",1)
                  parts=meta.split()
                  if len(parts)>=4 and path.lower().endswith(".zip"):
                      zips.append({"path":path,"git_blob_sha":parts[2],"size":0 if parts[3]=="-" else int(parts[3])})
              except Exception:
                  pass

          text_ext=(".md",".txt",".json",".jsonl",".yml",".yaml",".py",".html")
          tree=run(["git","ls-tree","-r","--name-only","HEAD"]).splitlines()
          text_paths=[p for p in tree if p.lower().endswith(text_ext)]

          url_re=re.compile(r"https?://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+(?:\.git)?")
          sha_re=re.compile(r"\b[0-9a-fA-F]{40}\b")

          records=[]
          for z in zips:
              path=z["path"]
              base=os.path.basename(path)
              add_commit=run(["git","log","--diff-filter=A","--format=%H","--",path],check=False).splitlines()
              refs=[]
              candidates=[]
              for tp in text_paths:
                  try:
                      txt=run(["git","show","HEAD:"+tp],check=False)
                  except Exception:
                      continue
                  if base not in txt and path not in txt:
                      continue
                  lines=txt.splitlines()
                  hit_idxs=[i for i,l in enumerate(lines) if base in l or path in l]
                  for i in hit_idxs[:10]:
                      lo=max(0,i-12); hi=min(len(lines),i+13)
                      window="\n".join(lines[lo:hi])
                      urls=sorted(set(url_re.findall(window)))
                      shas=sorted(set(sha_re.findall(window)))
                      refs.append({"file":tp,"line":i+1,"urls":urls,"shas":shas})
                      if len(urls)==1 and len(shas)==1:
                          candidates.append({"source_url":urls[0],"source_commit":shas[0],"evidence_file":tp,"evidence_line":i+1})
              unique={(c["source_url"].lower().removesuffix(".git"),c["source_commit"].lower()):c for c in candidates}
              chosen=list(unique.values())
              component_eligible=len(chosen)==1
              records.append({
                  **z,
                  "added_in_destination_commit":add_commit[0] if add_commit else "INSUFFICIENT_EVIDENCE",
                  "references":refs,
                  "provenance_candidates":chosen,
                  "component_eligible":component_eligible,
                  "status":"CANDIDATE_VERIFIABLE" if component_eligible else "INSUFFICIENT_EVIDENCE"
              })

          result={
              "schema":"YAIWES-INVENTORY-INDEXES-V3-RECOVERY-PROVENANCE",
              "repository":repo,
              "branch":"main",
              "main_commit":head,
              "workflow_run_url":server+"/"+repo+"/actions/runs/"+run_id,
              "archives":records,
              "counts":{
                  "zip_archives":len(records),
                  "component_candidates":sum(1 for r in records if r["component_eligible"]),
                  "insufficient_evidence":sum(1 for r in records if not r["component_eligible"])
              }
          }
          with open("audit-v3-provenance/provenance-v3.json","w",encoding="utf-8") as f:
              json.dump(result,f,ensure_ascii=False,indent=2)
          with open("audit-v3-provenance/provenance-v3.md","w",encoding="utf-8") as f:
              f.write("# Provenance recovery V3 — "+repo+"\n\n")
              for k,v in result["counts"].items():
                  f.write("- "+k+": "+str(v)+"\n")
              f.write("\n")
              for r in records:
                  f.write("- "+r["path"]+" — "+r["status"]+"\n")
          PY

      - name: Validate provenance evidence
        run: |
          test -s audit-v3-provenance/provenance-v3.json
          python3 -m json.tool audit-v3-provenance/provenance-v3.json >/dev/null

      - name: Upload provenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inventory-forensic-v3-recovery-provenance-Orquestador-Maxbry-
          path: audit-v3-provenance/
          if-no-files-found: error
          retention-days: 30
